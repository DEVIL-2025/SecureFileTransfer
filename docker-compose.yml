version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure_file_transfer_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=generate-a-secure-random-key-here-for-production
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/secure_transfer_db
      - MAX_CONTENT_LENGTH=524288000 # 500 MB
      - CORS_ORIGIN=*
    volumes:
      - uploads_data:/app/uploads
      - rsa_keys_data:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: secure_file_transfer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: secure_transfer_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads_data:
  rsa_keys_data:
