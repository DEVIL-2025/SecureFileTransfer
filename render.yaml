services:
  - type: web
    name: secure-file-transfer
    env: python
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: secure-transfer-db
          property: connectionString
      - key: SOCKETIO_ASYNC_MODE
        value: threading
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: secure-transfer-db
    plan: free
    databaseName: secure_transfer_db
    user: transfer_admin
